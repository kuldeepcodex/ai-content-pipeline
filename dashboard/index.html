<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Approval</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --line:#e2e2dc; --accent:#2a6df4;
          --good:#1e8a4c; --bad:#c23b32; --tag:#eef2fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --text:#ecece8; --muted:#9a9a93; --line:#33332f; --accent:#6c9bff;
            --good:#4cc582; --bad:#ef7a72; --tag:#252a38; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:16px 0; }
  input, textarea, button { font:inherit; color:inherit; }
  input[type=password] { flex:1; min-width:180px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); }
  button { padding:7px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.good { border-color:var(--good); color:var(--good); }
  button.bad { border-color:var(--bad); color:var(--bad); }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .article { margin:28px 0 8px; font-size:16px; font-weight:600; }
  .article a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:10px 0; }
  .meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--tag); }
  .text { white-space:pre-wrap; word-break:break-word; }
  .tags { margin-top:8px; color:var(--accent); font-size:13px; }
  textarea { width:100%; min-height:130px; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); resize:vertical; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
  .count.over { color:var(--bad); font-weight:600; }
  #msg { min-height:20px; margin:8px 0; font-size:14px; }
  #msg.err { color:var(--bad); } #msg.ok { color:var(--good); }
  .empty { padding:32px 0; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Content approval</h1>
  <div class="muted" id="stats">Enter your dashboard token to begin.</div>
  <div class="bar">
    <input type="password" id="token" placeholder="Dashboard token" autocomplete="off">
    <button class="primary" id="connect">Connect</button>
  </div>
  <div class="bar tabs" id="tabs"></div>
  <div id="msg" role="status"></div>
  <div id="list"></div>
</div>
<script>
const TABS = [["review","Needs review"],["approved","Approved"],["rejected","Rejected"],["posted","Posted"],["failed","Failed"]];
const TWITTER_MAX = 240;
let token = "", view = "review";
try { token = sessionStorage.getItem("token") || ""; } catch (e) {}

const $ = (s) => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  kids.forEach((c) => n.append(c));
  return n;
}
function say(text, kind) { const m = $("#msg"); m.textContent = text || ""; m.className = kind || ""; }

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token } });
  if (!res.ok) {
    let msg = res.statusText;
    try { const j = await res.json(); msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail); } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

function safeHref(url) { try { const u = new URL(url); return /^https?:$/.test(u.protocol) ? u.href : null; } catch (e) { return null; } }
function tagLength(tags) { return tags.reduce((n, t) => n + t.length + 2, 0); }

function drawTabs() {
  const box = $("#tabs"); box.replaceChildren();
  for (const [key, label] of TABS) {
    const b = el("button", { text: label, "data-view": key, class: key === view ? "on" : "" });
    b.addEventListener("click", () => { view = key; drawTabs(); load(); });
    box.append(b);
  }
}

async function loadStats() {
  try {
    const s = await api("/api/stats");
    let run = "No runs yet";
    if (s.last_run) {
      const hours = Math.round((Date.now() - new Date(s.last_run.started_at).getTime()) / 36e5);
      run = `Last run ${hours}h ago: ${s.last_run.status}, ${s.last_run.drafts_created} drafts` + (hours > 12 ? " (the schedule may have stopped)" : "");
    }
    $("#stats").textContent = `${s.needs_review} waiting for review. ${run}.`;
  } catch (e) { $("#stats").textContent = ""; }
}

function card(d) {
  const readOnly = !(d.status === "pending" || d.status === "edited");
  const body = el("div", { class: "text", text: d.text });
  const tags = el("div", { class: "tags", text: d.hashtags.map((t) => "#" + t).join(" ") });
  const note = d.post_ref ? el("div", { class: "muted", text: (d.status === "failed" ? "Error: " : "Post: ") + d.post_ref }) : null;
  const root = el("div", { class: "card", "data-id": d.id },
    el("div", { class: "meta" },
      el("span", { class: "badge", text: d.platform }),
      el("span", { class: "badge", text: "score " + (d.critic_score ?? "-") }),
      el("span", { class: "badge", text: d.status })),
    body, tags);
  if (note) root.append(note);
  if (readOnly) return root;

  const actions = el("div", { class: "actions" });
  const edit = el("button", { text: "Edit" }), approve = el("button", { class: "good", text: "Approve" }),
        reject = el("button", { class: "bad", text: "Reject" });
  actions.append(approve, edit, reject);
  root.append(actions);

  approve.addEventListener("click", () => decide(d.id, "approve", "Approved. It is posted on the next pipeline run."));
  reject.addEventListener("click", () => decide(d.id, "reject", "Rejected."));
  edit.addEventListener("click", () => {
    const area = el("textarea", {}); area.value = d.text;
    const count = el("span", { class: "count muted" });
    const update = () => {
      if (d.platform !== "twitter") { count.textContent = area.value.length + " characters"; return; }
      const n = area.value.length + tagLength(d.hashtags);
      count.textContent = `${n}/${TWITTER_MAX} with hashtags`; count.className = "count " + (n > TWITTER_MAX ? "over" : "muted");
    };
    area.addEventListener("input", update); update();
    const save = el("button", { class: "primary", text: "Save" }), cancel = el("button", { text: "Cancel" });
    save.addEventListener("click", async () => {
      try { await api("/api/drafts/" + d.id, { method: "PATCH", body: JSON.stringify({ text: area.value }) }); say("Saved. Approve it when ready.", "ok"); load(); }
      catch (e) { say(e.message, "err"); }
    });
    cancel.addEventListener("click", () => load());
    body.replaceWith(area); actions.replaceChildren(save, cancel, count);
  });
  return root;
}

async function decide(id, action, okText) {
  try { await api(`/api/drafts/${id}/${action}`, { method: "POST" }); say(okText, "ok"); load(); }
  catch (e) { say(e.message, "err"); }
}

async function load() {
  const list = $("#list");
  try {
    const drafts = await api("/api/drafts?status=" + view);
    list.replaceChildren();
    if (!drafts.length) { list.append(el("div", { class: "empty", text: "Nothing here yet." })); }
    let lastKey = null;
    for (const d of drafts) {
      const key = d.article_url;
      if (key !== lastKey) {
        const href = safeHref(d.article_url);
        const title = href ? el("a", { href, target: "_blank", rel: "noopener noreferrer", text: d.article_title })
                           : el("span", { text: d.article_title });
        list.append(el("div", { class: "article" }, title));
        lastKey = key;
      }
      list.append(card(d));
    }
    loadStats();
  } catch (e) { list.replaceChildren(); say(e.message, "err"); }
}

$("#connect").addEventListener("click", () => {
  token = $("#token").value.trim();
  try { sessionStorage.setItem("token", token); } catch (e) {}
  say(""); load();
});
$("#token").value = token;
drawTabs();
if (token) load();
</script>
</body>
</html>
